name: Update profile stats

on:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: signal
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: activity
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: languages
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      - name: Refresh streak card while preserving its design
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          user = "eldqyqy2007"
          cairo = ZoneInfo("Africa/Cairo")
          today = datetime.now(cairo).date()

          req = urllib.request.Request(
              f"https://github.com/users/{user}/contributions",
              headers={"User-Agent": "github-profile-streak/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")

          days = {}
          for m in re.finditer(
              r'<td\b[^>]*\bdata-date="([^"]+)"[^>]*\bid="([^"]+)"[^>]*>',
              page,
              re.I | re.S,
          ):
              day, cell_id = m.groups()
              tip = re.search(
                  r'<tool-tip\b[^>]*\bfor="' + re.escape(cell_id) + r'"[^>]*>(.*?)</tool-tip>',
                  page,
                  re.I | re.S,
              )
              count = 0
              if tip:
                  plain = html.unescape(re.sub(r"<[^>]+>", " ", tip.group(1)))
                  cm = re.search(r"(\d[\d,]*)\s+contributions?", plain, re.I)
                  if cm:
                      count = int(cm.group(1).replace(",", ""))
              days[day] = count

          if not days:
              raise SystemExit("Could not read GitHub contribution calendar")

          cursor = today
          current = 0
          if days.get(cursor.isoformat(), 0) == 0:
              cursor -= timedelta(days=1)
          while days.get(cursor.isoformat(), 0) > 0:
              current += 1
              cursor -= timedelta(days=1)

          url = (
              "https://streak-stats.demolab.com/?user=eldqyqy2007"
              "&theme=github-dark-blue&hide_border=true&locale=en"
              "&timezone=Africa%2FCairo&date_format=j%2Fn%2FY"
          )
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-profile-streak/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              svg = response.read().decode("utf-8", "replace")

          label_match = re.search(r'>\s*Current Streak\s*<', svg, re.I)
          if not label_match:
              raise SystemExit("Could not locate Current Streak label")

          before = svg[:label_match.start()]
          number_match = list(re.finditer(r'>\s*(\d+)\s*<', before))
          if not number_match:
              raise SystemExit("Could not locate Current Streak value")

          value_match = number_match[-1]
          start, end = value_match.span(1)
          svg = svg[:start] + str(current) + svg[end:]

          with open("profile/streak.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print(f"Current Streak: {current}")
          PY

      - name: Publish generated cards
        env:
          SIGNAL_DIR: ${{ steps.signal.outputs.ready-dir }}
          ACTIVITY_DIR: ${{ steps.activity.outputs.ready-dir }}
          LANGUAGES_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$SIGNAL_DIR"/signal-field-*.svg profile/
          cp "$ACTIVITY_DIR"/activity-consistency-*.svg profile/
          cp "$LANGUAGES_DIR"/language-composition-*.svg profile/
          test -s profile/signal-field-wide-dark.svg
          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/language-composition-wide-dark.svg
          test -s profile/streak.svg
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "eldqyqy2007"
          git config user.email "108406969+eldqyqy2007@users.noreply.github.com"
          git commit -m "Update profile stats"
          git push
